# =============================================================================
# Project Lumine — docker-compose.yml
# Services: mysql (8.0) + backend (FastAPI)
# Named volume: lumine_mysql_data — survives container restarts
# Health check: backend waits for MySQL to be genuinely ready
# Dev overrides: docker-compose.override.yml (hot reload, volume mount)
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # MySQL 8.0
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - lumine_mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # FastAPI backend
  # Waits for mysql health check before starting.
  # Runs alembic upgrade head then starts uvicorn in one shell command.
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

# -----------------------------------------------------------------------------
# Named volume — data persists across `docker-compose down` restarts.
# Use `docker-compose down -v` to wipe data (destructive — use with care).
# -----------------------------------------------------------------------------
volumes:
  lumine_mysql_data:
