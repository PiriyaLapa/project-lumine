# =============================================================================
# Project Lumine — docker-compose.e2e.yml
# Fully isolated, disposable E2E stack — separate volume/ports from the dev
# stack (docker-compose.yml) so automated test runs can NEVER touch the
# hand-curated manual QA data sitting in lumine_mysql_data.
#
# Run:   docker compose -f docker-compose.e2e.yml up -d
# Wipe:  docker compose -f docker-compose.e2e.yml down -v
#
# Credentials here are throwaway, local-only, and never touch real data —
# fine to keep in plain text, unlike the real .env.
# =============================================================================

services:

  e2e-mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: e2e-root-password
      MYSQL_DATABASE: lumine_e2e
      MYSQL_USER: lumine_e2e
      MYSQL_PASSWORD: e2e-app-password
    volumes:
      - lumine_e2e_mysql_data:/var/lib/mysql
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pe2e-root-password"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  e2e-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: mysql+pymysql://lumine_e2e:e2e-app-password@e2e-mysql:3306/lumine_e2e
      SECRET_KEY: e2e-test-only-secret-not-for-production
      GOOGLE_DRIVE_CREDENTIALS_PATH: credentials.json
      GOOGLE_DRIVE_FOLDER_ID: e2e-no-real-folder
      ENVIRONMENT: e2e
    ports:
      - "8010:8000"
    depends_on:
      e2e-mysql:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  lumine_e2e_mysql_data:
