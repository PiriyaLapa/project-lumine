# =============================================================================
# Project Lumine — docker-compose.override.yml  (DEV ONLY)
# Docker Compose merges this automatically with docker-compose.yml in dev.
# Do NOT use in production — volume mount disables the built image's code.
#
# What this adds:
#   - Volume mount: ./backend → /app  (code changes apply without rebuild)
#   - --reload flag on uvicorn        (hot reload on file save)
#   - ENV=development                 (matches config.py's Settings.ENV —
#                                       previously named ENVIRONMENT here,
#                                       which the app never actually reads)
# =============================================================================

services:
  backend:
    volumes:
      - ./backend:/app
    environment:
      ENV: development
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
